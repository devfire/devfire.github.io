  <style>
    :root{

      --serif:"Fraunces",Georgia,"Times New Roman",serif;
      --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

    @media (prefers-color-scheme: dark){

    *{margin:0;box-sizing:border-box}
    body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:clamp(1.5rem,5vw,3rem);line-height:1.6;-webkit-font-smoothing:antialiased}

    p{margin-top:1.1rem;color:var(--ink-soft);font-size:1.1rem}
    a{color:var(--accent);font-weight:540;text-decoration:none;display:inline-flex;gap:.45rem;margin-top:1.8rem;font-size:1rem}
    a:hover{text-decoration:underline;text-underline-offset:.22em}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
  </style>
</head>
